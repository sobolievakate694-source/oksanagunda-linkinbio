<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Оксана Гунда — міжнародна юридична радниця</title>
  <meta name="description" content="Оксана Гунда — міжнародна юридична радниця. Київ · Цюрих · Лондон">
  <meta name="theme-color" content="#F5F0EA">

  <!-- Social preview (Telegram, WhatsApp, Facebook) -->
  <meta property="og:title" content="Оксана Гунда — міжнародна юридична радниця">
  <meta property="og:description" content="Київ · Цюрих · Лондон">
  <meta property="og:image" content="images/portrait.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       ПАЛІТРА — тільки ці три кольори (+ їх прозорості)
       ========================================================= */
    :root {
      --bg:     #F5F0EA;  /* фон */
      --text:   #281C15;  /* основний текст */
      --accent: #042F35;  /* зелений акцент */

      --card:   #F7F3EE;  /* секція: на ~1% світліше фону */
      --btn:    #FAF7F3;  /* кнопка: на ~2% світліше фону */
      --line:   rgba(40, 28, 21, 0.08);
      --line-2: rgba(40, 28, 21, 0.28);
      --shadow: 0 1px 2px rgba(40, 28, 21, 0.04), 0 4px 14px rgba(40, 28, 21, 0.035);

      --serif: "Cormorant Garamond", "Times New Roman", serif;
      --sans:  "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

      --page-w: 430px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

    .page {
      max-width: var(--page-w);
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      overflow: hidden;
    }

    /* =========================================================
       HERO: фото + дуга + круглий портрет
       ========================================================= */
    .hero {
      position: relative;
      height: 240px;
    }

    .hero__photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 40% 30%;
      display: block;
      animation: heroIn 1.1s cubic-bezier(.22,.61,.36,1) both;
    }

    /* Світла дуга, що "піднімається" по центру на фото */
    .hero::after {
      content: "";
      position: absolute;
      left: -18%;
      right: -18%;
      bottom: -1px;
      height: 64px;
      background: var(--bg);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .portrait {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 118px;
      width: 180px;
      height: 180px;
      margin-left: -90px;
      border-radius: 50%;
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 1px var(--line), 0 6px 20px rgba(40, 28, 21, 0.08);
      overflow: hidden;
      background: var(--card);
      animation: portraitIn .9s .25s cubic-bezier(.22,.61,.36,1) both;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =========================================================
       ІМ'Я
       ========================================================= */
    .intro {
      text-align: center;
      padding: 68px 16px 0;
      animation: fadeUp .8s .4s ease both;
    }

    .intro__name {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 44px;
      line-height: 1.05;
      letter-spacing: -0.005em;
    }

    .intro__role {
      margin-top: 6px;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .intro__cities {
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 0.01em;
    }

    /* =========================================================
       СЕКЦІЇ (Соцмережі / Публікації)
       ========================================================= */
    .section {
      margin: 16px 16px 0;
      padding: 16px 14px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      animation: fadeUp .8s ease both;
    }
    .intro + .section { margin-top: 26px; animation-delay: .5s; }
    .section + .section { animation-delay: .6s; }

    .section__title {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 5px;
      margin-bottom: 12px;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 25px;
      line-height: 1.2;
    }
    .section__title::after {
      content: "";
      width: 94px;
      height: 1px;
      background: var(--line-2);
    }

    .links {
      list-style: none;
      display: grid;
      gap: 6px;
    }

    .link {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 7px 18px 7px 15px;
      background: var(--btn);
      border: 1px solid var(--line);
      border-radius: 7px;
      box-shadow: 0 1px 2px rgba(40, 28, 21, 0.035);
      transition: background-color .3s ease, border-color .3s ease;
    }
    .link:hover,
    .link:focus-visible { background: var(--bg); border-color: rgba(40, 28, 21, 0.14); }
    .link:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }
    .link:active { background: var(--card); }

    .link__icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      margin-right: 22px;
      background: var(--accent);
      border-radius: 6px;
      color: var(--bg);
    }
    .link__icon svg { width: 19px; height: 19px; display: block; }

    .link__label {
      flex: 1;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.005em;
    }

    /* Публікації — назва видання серифом, без іконки */
    .link--text { min-height: 48px; padding-left: 18px; }
    .link--text .link__label {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 0.02em;
    }

    .link__arrow {
      flex: none;
      width: 18px;
      height: 18px;
      color: var(--text);
      transition: transform .3s cubic-bezier(.22,.61,.36,1);
    }
    .link:hover .link__arrow,
    .link:focus-visible .link__arrow,
    .link:active .link__arrow { transform: translateX(4px); }

    /* =========================================================
       ПЕРЕМИКАЧ МОВИ UA / EN
       ========================================================= */
    .lang {
      position: absolute;
      z-index: 3;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      display: flex;
      padding: 3px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 2px 10px rgba(40, 28, 21, 0.08);
      animation: fadeUp .8s .5s ease both;
    }

    .lang__btn {
      min-width: 38px;
      height: 28px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .3s ease, color .3s ease;
    }
    .lang__btn:hover { background: var(--card); }
    .lang__btn[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
    .lang__btn:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

    /* =========================================================
       DESKTOP — сторінка стоїть по центру, не розтягується
       ========================================================= */
    @media (min-width: 600px) {
      .page { padding-top: 40px; padding-bottom: 64px; }
      .hero { border-radius: 16px 16px 0 0; }
      .hero__photo { border-radius: 16px 16px 0 0; }
    }

    /* =========================================================
       АНІМАЦІЇ
       ========================================================= */
    @keyframes heroIn   { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
    @keyframes portraitIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <main class="page">

    <header class="hero">
      <img class="hero__photo" src="images/hero.jpg" alt="" fetchpriority="high">

      <div class="lang" role="group" aria-label="Мова / Language">
        <button type="button" class="lang__btn" data-lang="uk">UA</button>
        <button type="button" class="lang__btn" data-lang="en">EN</button>
      </div>

      <div class="portrait">
        <img src="images/portrait.jpg" alt="Оксана Гунда" data-i18n-alt="name">
      </div>
    </header>

    <section class="intro">
      <h1 class="intro__name" data-i18n="name">Оксана Гунда</h1>
      <p class="intro__role" data-i18n="role">Міжнародна юридична радниця</p>
      <p class="intro__cities" data-i18n="cities">Київ · Цюрих · Лондон</p>
    </section>

    <section class="section" aria-labelledby="social-title">
      <h2 class="section__title" id="social-title" data-i18n="socialTitle">Соцмережі</h2>
      <ul class="links" id="social-list"></ul>
    </section>

    <section class="section" aria-labelledby="pubs-title">
      <h2 class="section__title" id="pubs-title" data-i18n="pubsTitle">Публікації</h2>
      <ul class="links" id="pubs-list"></ul>
    </section>

  </main>

  <script>
    /* =========================================================
       ТЕКСТИ — українська / англійська
       ========================================================= */
    const TEXTS = {
      uk: {
        title:       "Оксана Гунда — міжнародна юридична радниця",
        name:        "Оксана Гунда",
        role:        "Міжнародна юридична радниця",
        cities:      "Київ · Цюрих · Лондон",
        socialTitle: "Соцмережі",
        pubsTitle:   "Публікації",
      },
      en: {
        title:       "Oksana Gunda — International Legal Advisor",
        name:        "Oksana Gunda",
        role:        "International Legal Advisor",
        cities:      "Kyiv · Zurich · London",
        socialTitle: "Social media",
        pubsTitle:   "Publications",
      },
    };

    const DEFAULT_LANG = "uk";

    /* =========================================================
       ПОСИЛАННЯ — редагувати тут
       label: один текст для обох мов, або { uk: "...", en: "..." }
       Щоб додати публікацію: додайте ще один рядок у PUBLICATIONS
       ========================================================= */
    const SOCIALS = [
      { label: "Instagram", icon: "instagram", url: "https://www.instagram.com/oksy_gunda" },
      { label: "Facebook",  icon: "facebook",  url: "https://www.facebook.com/share/1FQm8dD9X5/" },
      { label: "LinkedIn",  icon: "linkedin",  url: "https://www.linkedin.com/in/oksana-gunda-563871389" },
      { label: "info@oksanagunda.com", icon: "mail", url: "mailto:info@oksanagunda.com" },
      // Сайт — тимчасово прихований. Щоб повернути, приберіть // на початку рядка:
      // { label: { uk: "Сайт", en: "Website" }, icon: "globe", url: "https://oksanagunda.com/" },
    ];

    const PUBLICATIONS = [
      { label: "NV",     url: "https://biz.nv.ua/ukr/markets/yak-strukturuvati-biznes-u-shveycariji-oksana-gunda-pro-zahist-aktiviv-i-mizhnarodni-investiciji-50638429.html" },
      { label: "ЮРЛІГА", url: "https://jurliga.ligazakon.net/analitycs/246300_sud-s-pro-mezh-korporativno-prozorost-chomu-sprava-jautiva-zmnyu-pdkhd-do-publchnost-danikh-aktsonerv" },
      { label: "DILO.UA", url: "https://delo.ua/economy/pravo-bez-kordoniv-oksana-gunda-pro-novi-yuridicni-zapiti-biznesu-vixid-na-jevropeiski-rinki-ta-zaxist-investicii-473206/" },
    ];

    /* ---------- Іконки (білі, на зеленому квадраті) ---------- */
    const ICONS = {
      instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>',
      facebook:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.4 21v-7.6h2.6l.4-3h-3V8.5c0-.9.3-1.5 1.5-1.5h1.6V4.3c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.7v3h2.6V21h3.1Z"/></svg>',
      linkedin:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.2 9h3.3v11H4.2V9Zm1.65-5.3a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8ZM9.6 9h3.1v1.5h.05c.45-.8 1.5-1.75 3.1-1.75 3.3 0 3.95 2.15 3.95 5V20h-3.3v-5.5c0-1.3 0-3-1.85-3s-2.1 1.4-2.1 2.9V20H9.6V9Z"/></svg>',
      globe:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.8" ry="8.5"/><path d="M3.5 12h17M4.8 7.5h14.4M4.8 16.5h14.4"/></svg>',
      mail:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 6.5 8 6 8-6"/></svg>',
    };

    const ARROW = '<svg class="link__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h16.5M14 6l6 6-6 6"/></svg>';

    function labelFor(item, lang) {
      return typeof item.label === "object" ? (item.label[lang] || item.label.uk) : item.label;
    }

    function renderLink(item, lang) {
      const hasIcon = Boolean(item.icon);
      const external = /^https?:/.test(item.url || "");
      return `
        <li>
          <a class="link${hasIcon ? "" : " link--text"}" href="${item.url || "#"}"
             ${external ? 'target="_blank" rel="noopener noreferrer"' : ""}>
            ${hasIcon ? `<span class="link__icon" aria-hidden="true">${ICONS[item.icon]}</span>` : ""}
            <span class="link__label">${labelFor(item, lang)}</span>
            ${ARROW}
          </a>
        </li>`;
    }

    /* ---------- Перемикач мови ---------- */
    function setLang(lang) {
      if (!TEXTS[lang]) lang = DEFAULT_LANG;
      const t = TEXTS[lang];

      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll("[data-i18n-alt]").forEach(el => { el.alt = t[el.dataset.i18nAlt]; });

      document.getElementById("social-list").innerHTML = SOCIALS.map(i => renderLink(i, lang)).join("");
      document.getElementById("pubs-list").innerHTML   = PUBLICATIONS.map(i => renderLink(i, lang)).join("");

      document.querySelectorAll(".lang__btn").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });

      try { localStorage.setItem("lang", lang); } catch (e) {}
    }

    document.querySelectorAll(".lang__btn").forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    // Мова: ?lang=en у посиланні → збережений вибір → українська
    let startLang = new URLSearchParams(location.search).get("lang");
    if (!startLang) { try { startLang = localStorage.getItem("lang"); } catch (e) {} }
    setLang(startLang || DEFAULT_LANG);
  </script>
</body>
</html>
